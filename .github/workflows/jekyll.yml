# Build the Jekyll site with our own Gemfile (Jekyll 4) and deploy it to GitHub
# Pages. Replaces the legacy Pages builder, which was pinned to Jekyll 3.9.
name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # The unsettled app repo pings this (via its dispatch-site.yml) after every
  # green push run on main, so the site rebuilds with the latest app; no submodule.
  repository_dispatch:
    types: ["unsettled-update"]

# Permissions required for the deploy-pages action to publish via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3" # Keep in sync with .ruby-version.
          bundler-cache: true # bundle install + cache gems between runs.
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      # Build the offline Catan app and its iOS OTA bundle from the newest
      # first-parent commit on unsettled main whose "Check and deploy" push run
      # succeeded, and drop them into _site/unsettled and _site/unsettled-ota.
      # Served as static files (Pages runs no Jekyll on the artifact).
      - name: List green unsettled runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/heyitaki/unsettled/actions/workflows/notify-site.yml/runs?branch=main&event=push&status=success&per_page=100" \
            --jq '.workflow_runs[].head_sha' > "$RUNNER_TEMP/unsettled-green-shas.txt"
      # Full history and tags: the OTA label counts commits and minNativeBuild
      # reads the store/ios/* tags; the publish script refuses a shallow or
      # tagless clone.
      - name: Checkout unsettled app
        uses: actions/checkout@v7
        with:
          repository: heyitaki/unsettled
          ref: main
          path: unsettled-src
          fetch-depth: 0
          fetch-tags: true
      - name: Check out the newest green unsettled commit
        working-directory: unsettled-src
        run: |
          sha=$(git rev-list --first-parent origin/main | grep -Fx -m1 -f "$RUNNER_TEMP/unsettled-green-shas.txt" || true)
          if [ -z "$sha" ]; then
            echo "::error::No first-parent commit on unsettled main has a successful Check and deploy push run"
            exit 1
          fi
          echo "Publishing unsettled $sha"
          git checkout --detach "$sha"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: unsettled-src/package-lock.json
      - name: Build unsettled
        run: npm ci && npm run build
        working-directory: unsettled-src
      - name: Copy unsettled into site
        run: |
          mkdir -p _site/unsettled
          cp -r unsettled-src/dist/. _site/unsettled/
          # Serve the app at /unsettled with no trailing slash. Pages only 301s
          # /foo -> /foo/ when foo/index.html exists, but serves foo.html directly
          # at /foo. So move the entry HTML up to _site/unsettled.html; assets stay
          # under /unsettled/ and resolve via their absolute refs. (/unsettled/ with
          # a slash lands on 404.html, which redirects to /unsettled.)
          mv _site/unsettled/index.html _site/unsettled.html
          # jekyll-sitemap ran before the app existed, so list its page by hand.
          # grep fails the build if the entry did not land.
          sed -i 's#</urlset>#<url>\n<loc>https://akshath.me/unsettled</loc>\n</url>\n</urlset>#' _site/sitemap.xml
          grep -q '<loc>https://akshath.me/unsettled</loc>' _site/sitemap.xml
      # Build, zip and encrypt the iOS OTA bundle and write its manifest to
      # _site/unsettled-ota/ (bundles/<sha256>.zip, then ios.json last).
      - name: Publish unsettled OTA bundle
        working-directory: unsettled-src
        env:
          OTA_BUNDLE_PRIVATE_KEY: ${{ secrets.UNSETTLED_OTA_BUNDLE_KEY }}
        run: node tools/ota/publish.mjs --out "$GITHUB_WORKSPACE/_site/unsettled-ota" --base-url https://akshath.me/unsettled-ota
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
