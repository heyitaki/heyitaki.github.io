---
layout: home
title: Puzzles
permalink: /puzzles
---

<ul class="post-list">
  {%- assign date_format = site.minima.date_format | default: "%b %-d, %Y" -%}
  {%- for puzzle in site.data.puzzles -%}
    <li>
      <span class="post-meta">{{ puzzle.date | date: date_format }}</span>
      <h1><a class="post-link" href="{{ puzzle.url }}">{{ puzzle.title | escape }}</a></h1>
    </li>
  {%- endfor -%}
</ul>
